<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="shared/appearance-init.js"></script>
    <link rel="stylesheet" href="shared/appearance.css" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="description" content="Yaqintop market — товары и магазины рядом" />
    <title>Yaqintop market</title>
    <link rel="icon" type="image/png" href="assets/yaqintop-buyer-transparent.png" />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=20261005-2" />
    <meta property="og:title" content="Yaqintop market — товары и магазины рядом" />
    <meta property="og:description" content="Найдите товар, сравните предложения магазинов и постройте маршрут." />
      <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/yaqintop-icon-192.png" />
      <link rel="stylesheet" href="shared/responsive.css" />
      <link rel="stylesheet" href="market.css?v=20261005-2" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="desktop-sidebar">
        <button class="brand" data-route="home" aria-label="Yaqintop market">
          <img src="assets/yaqintop-buyer-transparent.png" alt="" />
          <span><b>Yaqintop market</b><small>Покупателям</small></span>
        </button>
        <nav id="desktopNav" class="desktop-nav"></nav>
        <div class="sidebar-bottom">
          <button class="soft-button" data-action="language"><i data-lucide="languages"></i><span data-i18n="language">Язык</span></button>
          <button class="profile-mini" data-route="profile"><span id="sideAvatar">M</span><span><b id="sideName">Гость</b><small data-i18n="profile">Профиль</small></span></button>
        </div>
      </aside>

      <main class="main-column">
        <header class="topbar">
          <button class="button catalog-shortcut" data-route="catalog"><i data-lucide="layout-grid"></i><span data-i18n="catalog">Каталог</span></button>
          <button class="mobile-brand brand" data-route="home"><img src="assets/yaqintop-buyer-transparent.png" alt="" /><b>Yaqintop market</b></button>
          <div class="global-search">
            <i data-lucide="search"></i>
            <input id="globalSearch" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="Поиск товаров и категорий" />
            <button id="clearSearch" class="icon-button hidden" aria-label="Очистить"><i data-lucide="x"></i></button>
            <div id="searchSuggestions" class="suggestions hidden"></div>
          </div>
          <button class="icon-button notification-button" data-route="notifications" aria-label="Уведомления"><i data-lucide="bell"></i><span id="notificationDot" class="notification-dot hidden"></span></button>
        </header>

        <section id="view" class="view" aria-live="polite"><div class="loader"><div class="spinner"></div></div></section>
      </main>

      <nav id="mobileNav" class="mobile-nav"></nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root"></div>
    <input id="filePicker" type="file" accept="image/jpeg,image/png,image/webp" hidden />

    <script src="vendor/lucide.min.js"></script>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/qrcode.js"></script>
    <script src="runtime-config.js"></script>
    <script src="startup.js?v=20261005-2"></script>
    <script type="module" src="app.js?v=20261005-2"></script>
  </body>
</html>
